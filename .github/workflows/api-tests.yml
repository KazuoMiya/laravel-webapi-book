# 第13章のワークフロー。このリポジトリではLaravelのプロジェクトが api フォルダーにあるので、
# 作業フォルダーを api に変え、api の変更があったときだけ動かす
name: api-tests

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api-tests.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: 依存パッケージのインストール
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: 環境設定
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: コードの書き方のチェック
        run: vendor/bin/pint --test

      - name: テスト
        run: php artisan test

      - name: 依存パッケージの脆弱性チェック
        run: composer audit

      - name: OpenAPI仕様書のチェック
        run: npx @redocly/cli lint docs/openapi.yaml

      # 第17章で本番用のイメージを作ったら追加する
      - name: 本番用イメージのビルドと起動の確認
        run: |
          docker build -t taskboard-api:ci .
          docker run --rm --entrypoint php taskboard-api:ci artisan --version
