# 第13章のワークフロー。このリポジトリではLaravelのプロジェクトが api フォルダーにあるので、
# 作業フォルダーを api に変え、api の変更があったときだけ動かす。
# 1つのチェックが失敗しても残りのチェックは続け、失敗の中身はジョブの概要（Summary）にも書き出す
name: api-tests

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api-tests.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api-tests.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: 依存パッケージのインストール
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: 環境設定
        id: setup
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: コードの書き方のチェック
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          if vendor/bin/pint --test; then exit 0; fi
          # 直すべき箇所を、ログインしなくても見られる概要に書き出す
          vendor/bin/pint > /dev/null
          {
            echo '## Pint が直す箇所'
            echo '```diff'
            git diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 注記（annotation）にも差分を入れる。注記は、ログインしなくても実行結果のページで読める
          git diff --name-only --relative | while read -r file; do
            body=$(git diff --relative -- "$file" | head -c 3500 | sed -e 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } 1')
            echo "::error file=api/$file,title=Pint の書き方に合っていません::$body"
          done
          git checkout -- .
          exit 1

      - name: テスト
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -o pipefail
          if php artisan test 2>&1 | tee test-output.log; then exit 0; fi
          {
            echo '## テストの失敗'
            echo '```text'
            tail -n 200 test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: 依存パッケージの脆弱性チェック
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: composer audit

      - name: OpenAPI仕様書のチェック
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -o pipefail
          if npx --yes @redocly/cli lint docs/openapi.yaml 2>&1 | tee lint-output.log; then exit 0; fi
          { echo '## 仕様書のチェックの失敗'; echo '```text'; tail -n 100 lint-output.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # 第17章で本番用のイメージを作ったら追加する
      - name: 本番用イメージのビルドと起動の確認
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          docker build -t taskboard-api:ci .
          docker run --rm --entrypoint php taskboard-api:ci artisan --version
